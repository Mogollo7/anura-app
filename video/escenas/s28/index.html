<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S28 Antes la terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
      body { margin: 0; background: #eef5ee; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eef5ee; color: #1b1c1e; font-family: "Archivo", sans-serif; }
      #txt { position: absolute; left: 80px; top: 280px; width: 760px; }
      #txt p { margin: 0; color: #1b1c1e; }
      #t28 { font-weight: 700; font-size: 48px; line-height: 1.15; opacity: 0; }
      #t29 { margin-top: 20px !important; font-weight: 500; font-size: 32px; line-height: 1.3; opacity: 0; }
      #t30 { position: absolute; left: 80px; top: 80px; width: 1680px; margin: 0; font-weight: 700; font-size: 36px; line-height: 1.2; color: #1b1c1e; opacity: 0; }
      #win { position: absolute; left: 960px; top: 260px; width: 800px; height: 480px; border-radius: 16px; background: #1b1c1e; overflow: hidden; box-shadow: 0 24px 48px rgba(27, 28, 30, 0.22); opacity: 0; transform-origin: 50% 50%; }
      #bar { position: absolute; left: 0; top: 0; right: 0; height: 48px; background: #26282b; }
      #bar i { position: absolute; top: 18px; width: 12px; height: 12px; border-radius: 50%; }
      #term { position: absolute; left: 32px; top: 80px; right: 32px; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px; line-height: 1.6; color: #d7e8d4; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
      .ln { margin: 0 0 8px 0; white-space: pre-wrap; }
      .ch { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s28" data-start="0" data-width="1920" data-height="1080" data-duration="5" data-fps="60">
      <div id="txt">
        <p id="t28">Antes todo era manual</p>
        <p id="t29">Poco estandarizado y un solo desarrollador tenía el control</p>
      </div>
      <p id="t30">Ahora con el modo admin puedes repetir el ciclo</p>
      <div id="win" data-layout-allow-occlusion>
        <div id="bar"><i style="left:20px;background:#e07a5f"></i><i style="left:40px;background:#c6a15b"></i><i style="left:60px;background:#1f7a33"></i></div>
        <div id="term">
          <p class="ln" id="l0"><span class="ch">c</span><span class="ch">o</span><span class="ch">n</span><span class="ch">s</span><span class="ch">t</span><span class="ch"> </span><span class="ch">M</span><span class="ch">I</span><span class="ch">N</span><span class="ch">_</span><span class="ch">F</span><span class="ch">O</span><span class="ch">T</span><span class="ch">O</span><span class="ch">S</span><span class="ch">_</span><span class="ch">E</span><span class="ch">N</span><span class="ch">T</span><span class="ch">R</span><span class="ch">E</span><span class="ch">N</span><span class="ch">A</span><span class="ch">B</span><span class="ch">L</span><span class="ch">E</span><span class="ch"> </span><span class="ch">=</span><span class="ch"> </span><span class="ch">1</span><span class="ch">0</span><span class="ch">;</span></p>
          <p class="ln" id="l1"><span class="ch">c</span><span class="ch">o</span><span class="ch">n</span><span class="ch">s</span><span class="ch">t</span><span class="ch"> </span><span class="ch">M</span><span class="ch">I</span><span class="ch">N</span><span class="ch">_</span><span class="ch">I</span><span class="ch">N</span><span class="ch">D</span><span class="ch">I</span><span class="ch">V</span><span class="ch">I</span><span class="ch">D</span><span class="ch">U</span><span class="ch">O</span><span class="ch">S</span><span class="ch"> </span><span class="ch">=</span><span class="ch"> </span><span class="ch">3</span><span class="ch">;</span></p>
          <p class="ln" id="l2"><span class="ch">c</span><span class="ch">o</span><span class="ch">n</span><span class="ch">s</span><span class="ch">t</span><span class="ch"> </span><span class="ch">e</span><span class="ch">s</span><span class="ch">E</span><span class="ch">n</span><span class="ch">t</span><span class="ch">r</span><span class="ch">e</span><span class="ch">n</span><span class="ch">a</span><span class="ch">b</span><span class="ch">l</span><span class="ch">e</span><span class="ch"> </span><span class="ch">=</span><span class="ch"> </span><span class="ch">(</span><span class="ch">m</span><span class="ch">)</span><span class="ch"> </span><span class="ch">=</span><span class="ch">&gt;</span><span class="ch"> </span><span class="ch">m</span><span class="ch">.</span><span class="ch">f</span><span class="ch">o</span><span class="ch">t</span><span class="ch">o</span><span class="ch">s</span><span class="ch">_</span><span class="ch">a</span><span class="ch">c</span><span class="ch">t</span><span class="ch">i</span><span class="ch">v</span><span class="ch">a</span><span class="ch">s</span><span class="ch"> </span><span class="ch">&gt;</span><span class="ch">=</span><span class="ch"> </span><span class="ch">M</span><span class="ch">I</span><span class="ch">N</span><span class="ch">_</span><span class="ch">F</span><span class="ch">O</span><span class="ch">T</span><span class="ch">O</span><span class="ch">S</span><span class="ch">_</span><span class="ch">E</span><span class="ch">N</span><span class="ch">T</span><span class="ch">R</span><span class="ch">E</span><span class="ch">N</span><span class="ch">A</span><span class="ch">B</span><span class="ch">L</span><span class="ch">E</span><span class="ch"> </span><span class="ch">&amp;</span><span class="ch">&amp;</span><span class="ch"> </span><span class="ch">m</span><span class="ch">.</span><span class="ch">i</span><span class="ch">n</span><span class="ch">d</span><span class="ch">i</span><span class="ch">v</span><span class="ch">i</span><span class="ch">d</span><span class="ch">u</span><span class="ch">o</span><span class="ch">s</span><span class="ch"> </span><span class="ch">&gt;</span><span class="ch">=</span><span class="ch"> </span><span class="ch">M</span><span class="ch">I</span><span class="ch">N</span><span class="ch">_</span><span class="ch">I</span><span class="ch">N</span><span class="ch">D</span><span class="ch">I</span><span class="ch">V</span><span class="ch">I</span><span class="ch">D</span><span class="ch">U</span><span class="ch">O</span><span class="ch">S</span><span class="ch">;</span></p>
          </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const EASE = "expo.out";
      // 131.10: T28. 131.80: T29. La ventana entra con T28.
      tl.fromTo("#t28", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: EASE }, 0.1);
      tl.fromTo("#t29", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: EASE }, 0.8);
      tl.fromTo("#win", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: EASE }, 0.1);
      // 131.50: empieza a teclearse. 0.015 s por carácter, pausa de 0.10 s entre líneas.
      let t = 0.5;
      [0, 1, 2].forEach((k) => {
        const cs = document.querySelectorAll("#l" + k + " .ch");
        cs.forEach((e, i) => tl.set(e, { opacity: 1 }, t + i * 0.015));
        t += cs.length * 0.015 + 0.1;
      });
      // 134.80-136.00: la ventana se cierra hacia el centro (escala en y) y entra T30 a la izquierda
      tl.to("#win", { scaleY: 0.02, opacity: 0, duration: 0.6, ease: "expo.in" }, 3.8);
      tl.to("#txt", { y: -16, opacity: 0, duration: 0.4, ease: "power2.in" }, 3.8);
      tl.fromTo("#t30", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: EASE }, 4.2);
      window.__timelines["s28"] = tl;
    </script>
  </body>
</html>
