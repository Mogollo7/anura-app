<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S26 Barras de especies</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
      body { margin: 0; background: #eef5ee; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eef5ee; color: #1b1c1e; font-family: "Archivo", sans-serif; }
      #txt { position: absolute; left: 80px; top: 280px; width: 760px; display: flex; flex-direction: column; gap: 24px; opacity: 0; }
      #txt p { margin: 0; }
      #t25 { font-weight: 500; font-size: 52px; line-height: 1.15; }
      #t26 { font-size: 44px; line-height: 1.25; opacity: 0; }
      #t26 .mono { font-size: 38px; }
      .ax { position: absolute; background: #1b1c1e; opacity: 0; }
      .head { position: absolute; width: 0; height: 0; opacity: 0; }
      .col { position: absolute; width: 160px; }
      .bar { position: absolute; inset: 0; transform-origin: 50% 100%; }
      .val { position: absolute; left: 0; right: 0; top: -44px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 28px; line-height: 28px; opacity: 0; }
    
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); font-style: italic; font-weight: 400; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
      .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; }
      .mono { font-family: "JetBrains Mono", monospace; font-weight: 500; font-style: normal; letter-spacing: -0.02em; }
      .brand { font-weight: 800; font-style: normal; font-family: "Archivo", sans-serif; }
      #root p, #root h1, #root span { text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s26" data-start="0" data-width="1920" data-height="1080" data-duration="6">
      <div id="txt">
        <p id="t25"><span class="brand">ANURA</span> ha pasado por distintas actualizaciones</p>
        <p id="t26" class="serif">Pasamos de <span class="mono">10</span> especies a <span class="mono">28</span> y luego a <span class="mono">41</span></p>
      </div>
      <div id="axY" class="ax" style="left:998px;top:172px;width:4px;height:650px;transform-origin:50% 100%"></div>
      <div id="hdY" class="head" style="left:986px;top:150px;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:24px solid #1b1c1e"></div>
      <div id="axX" class="ax" style="left:998px;top:818px;width:822px;height:4px;transform-origin:0% 50%"></div>
      <div id="hdX" class="head" style="left:1820px;top:806px;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:24px solid #1b1c1e"></div>
      <div class="col" style="left:1100px;top:683px;height:137px"><div class="val" id="val0">10</div><div class="bar" id="bar0" style="background:#7EB8DA"></div></div>
      <div class="col" style="left:1360px;top:437px;height:383px"><div class="val" id="val1">28</div><div class="bar" id="bar1" style="background:#5B8FA8"></div></div>
      <div class="col" style="left:1620px;top:260px;height:560px"><div class="val" id="val2">41</div><div class="bar" id="bar2" style="background:#1F7A33"></div></div>

    </div>

    <script>
      // Ventana 103.00–109.00. Primero los ejes (Y hacia arriba, X hacia la derecha), después las barras de menor a mayor.
      const tl = gsap.timeline({ paused: true });
      const EASE = "expo.out";
      const H = [137, 383, 560];
      tl.to("#txt", { opacity: 1, duration: 0.01 }, 0.2);
      tl.fromTo("#t25", { y: 40, filter: "blur(12px)" }, { y: 0, filter: "blur(0px)", duration: 0.5, ease: EASE }, 0.2);
      tl.set(["#axY", "#hdY"], { opacity: 1 }, 0.5);
      tl.fromTo("#axY", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: EASE }, 0.5);
      tl.fromTo("#hdY", { y: 670 }, { y: 0, duration: 0.4, ease: EASE }, 0.5);
      tl.set(["#axX", "#hdX"], { opacity: 1 }, 0.9);
      tl.fromTo("#axX", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: EASE }, 0.9);
      tl.fromTo("#hdX", { x: -820 }, { x: 0, duration: 0.4, ease: EASE }, 0.9);
      for (let i = 0; i < 3; i++) {
        const t0 = 1.5 + i * 0.5;
        tl.fromTo("#bar" + i, { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: EASE }, t0);
        tl.fromTo("#val" + i, { y: H[i], opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: EASE }, t0);
      }
      tl.fromTo("#t26", { y: 16, opacity: 0, filter: "blur(12px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: EASE }, 3.2);
      // 108.40–109.00: el bloque se prepara para correr a la izquierda
      tl.to("#txt", { x: -24, opacity: 0.7, duration: 0.6, ease: "power2.inOut" }, 5.4);
      window.__timelines = window.__timelines || {};
      window.__timelines["s26"] = tl;
    </script>
  </body>
</html>
