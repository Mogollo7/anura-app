<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S16 Pasos 1 a 3</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      body { margin: 0; background: #eef5ee; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eef5ee; color: #1b1c1e; font-family: "Archivo", sans-serif; }
      .t { position: absolute; margin: 0; text-align: center; font-weight: 500; }
      #t17old { left: 210px; top: 430px; width: 1500px; font-size: 96px; line-height: 1.2; text-wrap: balance; }
      #t17 { left: 120px; top: 70px; width: 1680px; font-size: 56px; line-height: 1.2; white-space: nowrap; opacity: 0; }
      .lab { position: absolute; top: 190px; width: 340px; text-align: center; font-weight: 700; font-size: 36px; line-height: 40px; opacity: 0; }
      .phone { position: absolute; top: 250px; width: 340px; height: 720px; box-sizing: border-box; padding: 14px; border-radius: 36px; background: #1b1c1e; box-shadow: 0 24px 40px rgba(27, 28, 30, 0.18); opacity: 0; }
      .phone .scr { width: 100%; height: 100%; border-radius: 24px; overflow: hidden; }
      .phone img { display: block; width: 100%; height: 100%; object-fit: cover; }
      #ph0 { filter: url(#bl0); } #ph1 { filter: url(#bl1); } #ph2 { filter: url(#bl2); }
    
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); font-style: italic; font-weight: 400; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
      .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; }
      .mono { font-family: "JetBrains Mono", monospace; font-weight: 500; font-style: normal; letter-spacing: -0.02em; }
      .brand { font-weight: 800; font-style: normal; font-family: "Archivo", sans-serif; }
      #root p, #root h1, #root span { text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s16" data-start="0" data-width="1920" data-height="1080" data-duration="3.5">
      <svg width="0" height="0" style="position: absolute" aria-hidden="true"><filter id="bl0" x="-80%" y="-10%" width="260%" height="120%"><feGaussianBlur id="b0" stdDeviation="0 0" /></filter><filter id="bl1" x="-80%" y="-10%" width="260%" height="120%"><feGaussianBlur id="b1" stdDeviation="0 0" /></filter><filter id="bl2" x="-80%" y="-10%" width="260%" height="120%"><feGaussianBlur id="b2" stdDeviation="0 0" /></filter></svg>

      <p id="t17old" class="t" data-layout-allow-overlap>Un cuestionario <span class="serif" style="white-space:nowrap">paso a paso</span> afina el modelo</p>
      <p id="t17" class="t" data-layout-allow-overlap>Un cuestionario <span class="serif" style="white-space:nowrap">paso a paso</span> afina el modelo</p>
      <div id="lab0" class="lab" style="left:310px">Paso 1</div>
      <div id="ph0" class="phone" data-layout-allow-overflow data-layout-allow-occlusion style="left:310px"><div class="scr"><img src="assets/img/1.jpg" alt="" /></div></div>
      <div id="lab1" class="lab" style="left:790px">Paso 2</div>
      <div id="ph1" class="phone" data-layout-allow-overflow data-layout-allow-occlusion style="left:790px"><div class="scr"><img src="assets/img/2.jpg" alt="" /></div></div>
      <div id="lab2" class="lab" style="left:1270px">Paso 3</div>
      <div id="ph2" class="phone" data-layout-allow-overflow data-layout-allow-occlusion style="left:1270px"><div class="scr"><img src="assets/img/3.jpg" alt="" /></div></div>
      <audio id="sfx0" src="assets/sfx/rollover2.ogg" data-start="0.55" data-duration="0.06" data-track-index="10" data-volume="1"></audio>
      <audio id="sfx1" src="assets/sfx/rollover2.ogg" data-start="1.05" data-duration="0.06" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx2" src="assets/sfx/rollover2.ogg" data-start="1.55" data-duration="0.06" data-track-index="12" data-volume="1"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const EASE = "expo.out";
      const $ = (id) => document.getElementById(id);

      // 65.00: el título de S15 se hace pequeño y sube a su sitio (top 70)
      tl.to("#t17old", { y: -30, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 0);
      tl.fromTo("#t17", { y: 24, opacity: 0, filter: "blur(12px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: EASE }, 0.2);

      // teléfonos: entran desde la derecha y aterrizan en su columna (0.25, 0.75, 1.25)
      [0, 1, 2].forEach((i) => {
        const t0 = 0.25 + i * 0.5;
        const node = $("b" + i);
        const p = { v: 40 };
        node.setAttribute("stdDeviation", "40 0");
        tl.fromTo("#ph" + i, { x: 1000, opacity: 1 }, { x: 0, opacity: 1, duration: 0.6, ease: EASE }, t0);
        tl.to(p, { v: 0, duration: 0.6, ease: EASE, onUpdate() { node.setAttribute("stdDeviation", p.v + " 0"); } }, t0);
        tl.fromTo("#lab" + i, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: EASE }, t0 + 0.3);
      });

      window.__timelines["s16"] = tl;
    </script>
  </body>
</html>
