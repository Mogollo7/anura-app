<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S18 Resultado</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      body { margin: 0; background: #eef5ee; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eef5ee; color: #1b1c1e; font-family: "Archivo", sans-serif; }
      #t17 { position: absolute; margin: 0; text-align: center; font-weight: 500; left: 120px; top: 70px; width: 1680px; font-size: 56px; line-height: 1.2; white-space: nowrap; }
      .lab { position: absolute; top: 190px; width: 340px; text-align: center; font-weight: 700; font-size: 36px; line-height: 40px; }
      .phone { position: absolute; top: 250px; width: 340px; height: 720px; box-sizing: border-box; padding: 14px; border-radius: 36px; background: #1b1c1e; box-shadow: 0 24px 40px rgba(27, 28, 30, 0.18); }
      .phone .scr { width: 100%; height: 100%; border-radius: 24px; overflow: hidden; }
      .phone img { display: block; width: 100%; height: 100%; object-fit: cover; }
      #t18 { position: absolute; left: 96px; top: 400px; width: 960px; margin: 0; font-weight: 500; font-size: 68px; line-height: 1.25; opacity: 0; }
      #rlab { position: absolute; left: 1208px; top: 130px; width: 504px; text-align: center; font-weight: 700; font-size: 36px; line-height: 40px; opacity: 0; }
      #rph { position: absolute; left: 1208px; top: 190px; width: 504px; height: 780px; box-sizing: border-box; padding: 14px; border-radius: 36px; background: #1b1c1e; box-shadow: 0 24px 40px rgba(27, 28, 30, 0.18); opacity: 0; filter: url(#rbl); }
      #rph .scr { width: 100%; height: 100%; border-radius: 24px; overflow: hidden; }
      #rph img { display: block; width: 100%; height: 100%; object-fit: cover; }
    
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); font-style: italic; font-weight: 400; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
      .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; }
      .mono { font-family: "JetBrains Mono", monospace; font-weight: 500; font-style: normal; letter-spacing: -0.02em; }
      .brand { font-weight: 800; font-style: normal; font-family: "Archivo", sans-serif; }
      #root p, #root h1, #root span { text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s18" data-start="0" data-width="1920" data-height="1080" data-duration="4.5">
      <svg width="0" height="0" style="position: absolute" aria-hidden="true"><filter id="obl0" x="-80%" y="-10%" width="260%" height="120%"><feGaussianBlur id="ob0" stdDeviation="0 0" /></filter><filter id="obl1" x="-80%" y="-10%" width="260%" height="120%"><feGaussianBlur id="ob1" stdDeviation="0 0" /></filter><filter id="obl2" x="-80%" y="-10%" width="260%" height="120%"><feGaussianBlur id="ob2" stdDeviation="0 0" /></filter><filter id="rbl" x="-80%" y="-10%" width="260%" height="120%"><feGaussianBlur id="rb" stdDeviation="0 0" /></filter></svg>
      <p id="t17">Un cuestionario <span class="serif" style="white-space:nowrap">paso a paso</span> afina el modelo</p>
      <div id="olab0" class="lab" style="left:310px">Paso 4</div>
      <div id="oph0" class="phone" style="left:310px;filter:url(#obl0)" data-layout-allow-overflow data-layout-allow-occlusion><div class="scr"><img src="assets/img/4.jpg" alt="" /></div></div>
      <div id="olab1" class="lab" style="left:790px">Resumen</div>
      <div id="oph1" class="phone" style="left:790px;filter:url(#obl1)" data-layout-allow-overflow data-layout-allow-occlusion><div class="scr"><img src="assets/img/6.jpg" alt="" /></div></div>
      <div id="olab2" class="lab" style="left:1270px">Analizando</div>
      <div id="oph2" class="phone" style="left:1270px;filter:url(#obl2)" data-layout-allow-overflow data-layout-allow-occlusion><div class="scr"><img src="assets/img/an.jpg" alt="" /></div></div>
      <p id="t18">Con más contexto <span class="serif">el resultado de tu observación mejora</span></p>
      <div id="rlab">Resultado</div>
      <div id="rph" data-layout-allow-overflow data-layout-allow-occlusion><div class="scr"><img src="assets/img/result.jpg" alt="" /></div></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const EASE = "expo.out";
      const $ = (id) => document.getElementById(id);
      function blurTo(id, from, to, dur, ease, at) {
        const node = $(id), p = { v: from };
        node.setAttribute("stdDeviation", from + " 0");
        tl.to(p, { v: to, duration: dur, ease, onUpdate() { node.setAttribute("stdDeviation", p.v + " 0"); } }, at);
      }
      // 72.00 - 72.40: los tres salen a la derecha (centro x -> 2500); T17 baja a opacidad 0 en su sitio
      [0, 1, 2].forEach((i) => {
        const dx = 2500 - [480, 960, 1440][i];
        tl.to("#oph" + i, { x: dx, duration: 0.4, ease: "expo.in" }, 0);
        tl.to("#olab" + i, { x: dx, duration: 0.4, ease: "expo.in" }, 0);
        blurTo("ob" + i, 0, 40, 0.4, "expo.in", 0);
      });
      tl.to("#t17", { opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, 0);
      // 72.40 -> 72.50: T18
      tl.fromTo("#t18", { y: 24, opacity: 0, filter: "blur(12px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: EASE }, 0.5);
      // 72.50 -> local 0.50: entra el teléfono del resultado desde la derecha
      tl.fromTo("#rph", { x: 1000, opacity: 1 }, { x: 0, opacity: 1, duration: 0.6, ease: EASE }, 0.5);
      blurTo("rb", 40, 0, 0.6, EASE, 0.5);
      tl.fromTo("#rlab", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: EASE }, 0.8);
      // 76.10 -> local 4.10 - 4.50: el teléfono sale a la derecha
      const dxr = 2500 - 1460;
      tl.to("#rph", { x: dxr, duration: 0.4, ease: "expo.in" }, 4.1);
      tl.to("#rlab", { x: dxr, duration: 0.4, ease: "expo.in" }, 4.1);
      blurTo("rb", 0, 40, 0.4, "expo.in", 4.1);
      window.__timelines["s18"] = tl;
    </script>
  </body>
</html>
