<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S10a Del contexto a los paquetes</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      body { margin: 0; background: #eef5ee; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eef5ee; color: #1b1c1e; font-family: "Archivo", sans-serif; }
      p { margin: 0; text-align: center; font-weight: 500; color: #1b1c1e; opacity: 0; }
      b { font-weight: 800; }
      #q { position: absolute; left: 80px; width: 1760px; top: 420px; font-size: 48px; line-height: 1.2; filter: url(#fq); }
      #t2 { position: absolute; left: 160px; width: 1600px; top: 280px; font-size: 56px; line-height: 1.15; filter: url(#ft); }
      #t2 .p { font-weight: 700; }
      #fold { position: absolute; inset: 0; filter: url(#ff); }
      .f { position: absolute; top: 408px; width: 240px; height: 160px; left: 840px; opacity: 0; }
      .f .body { position: absolute; left: 0; right: 0; top: 22px; bottom: 0; background: #ffffff; border: 2px solid #1f7a33; border-radius: 12px; box-sizing: border-box; box-shadow: 0 18px 28px rgba(27, 28, 30, 0.16); }
      .f .tab { position: absolute; left: 0; top: 0; width: 96px; height: 34px; background: #1f7a33; border-radius: 12px 12px 0 0; }
      .f .paper { position: absolute; left: 18px; right: 18px; top: 12px; height: 60px; background: #ffffff; border: 2px solid #1f7a33; border-radius: 8px; box-sizing: border-box; z-index: 0; }
      .f .tab, .f .paper { z-index: 0; }
      .f .body { z-index: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s10a" data-start="0" data-width="1920" data-height="1080" data-duration="8" data-fps="60">
      <p id="q">¿Recuerdas que dijimos antes que <b>ANURA</b> es un modelo basado en contexto?</p>
      <p id="t2">Para ello <b>ANURA</b> utiliza <span class="p">paquetes</span></p>
      <div id="fold">
        <div class="f" id="f0"><div class="paper"></div><div class="tab"></div><div class="body"></div></div>
        <div class="f" id="f1"><div class="paper"></div><div class="tab"></div><div class="body"></div></div>
        <div class="f" id="f2"><div class="paper"></div><div class="tab"></div><div class="body"></div></div>
        <div class="f" id="f3"><div class="paper"></div><div class="tab"></div><div class="body"></div></div>
        <div class="f" id="f4"><div class="paper"></div><div class="tab"></div><div class="body"></div></div>
        </div>
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="fq" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur id="fqg" stdDeviation="0 0"/></filter>
        <filter id="ft" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur id="ftg" stdDeviation="0 0"/></filter>
        <filter id="ff" x="0" y="0" width="100%" height="100%"><feGaussianBlur id="ffg" stdDeviation="0 0"/></filter>
      </svg>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const EASE = "expo.out";
      const CX = [420, 690, 960, 1230, 1500], ROT = [-12, -6, 0, 6, 12];
      // 48.00-48.50: la pregunta desde y+24, blur vertical 12 -> 0
      tl.fromTo("#q", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: EASE }, 0);
      tl.fromTo("#fqg", { attr: { stdDeviation: "0 12" } }, { attr: { stdDeviation: "0 0" }, duration: 0.5, ease: EASE }, 0);
      // 52.25-52.75: la pregunta sube 40 px, blur 12, opacidad 0
      tl.to("#q", { y: -40, opacity: 0, duration: 0.5, ease: "expo.in" }, 4.25);
      tl.to("#fqg", { attr: { stdDeviation: "12 12" }, duration: 0.5, ease: "expo.in" }, 4.25);
      // 52.50-53.00: la frase de paquetes desde y+16, blur vertical 8 -> 0
      tl.fromTo("#t2", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: EASE }, 4.5);
      tl.fromTo("#ftg", { attr: { stdDeviation: "0 8" } }, { attr: { stdDeviation: "0 0" }, duration: 0.5, ease: EASE }, 4.5);
      // 53.25-53.75: una sola carpeta (la del centro), outBack, escala 0.92 -> 1
      tl.fromTo("#f2", { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }, 5.25);
      // 53.75-54.75: se abre en cinco, blur horizontal solo mientras se mueven
      [0, 1, 3, 4].forEach((i) => tl.set("#f" + i, { opacity: 1 }, 5.75));
      [0, 1, 2, 3, 4].forEach((i) => {
        tl.to("#f" + i, { x: CX[i] - 960, rotation: ROT[i], duration: 1, ease: EASE }, 5.75);
      });
      tl.fromTo("#ffg", { attr: { stdDeviation: "14 0" } }, { attr: { stdDeviation: "0 0" }, duration: 1, ease: EASE, immediateRender: false }, 5.75);
      // 55.50-56.00: la frase y las cinco carpetas suben 24 px, blur 10, opacidad 0
      tl.to(["#t2", "#fold"], { y: -24, opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7.5);
      tl.to(["#ftg", "#ffg"], { attr: { stdDeviation: "10 10" }, duration: 0.5, ease: "power2.inOut" }, 7.5);
      window.__timelines["s10a"] = tl;
    </script>
  </body>
</html>
