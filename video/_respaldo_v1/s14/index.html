<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S14 Al folder</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      body { margin: 0; background: #eef5ee; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eef5ee; color: #1b1c1e; font-family: "Archivo", sans-serif; }
      #t16 { position: absolute; left: 120px; top: 100px; width: 1680px; margin: 0; text-align: center; font-weight: 600; font-size: 64px; line-height: 1.2; }
      #stack { position: absolute; inset: 0; z-index: 3; clip-path: inset(0 0 280px 0); }
      .card { position: absolute; top: 340px; width: 380px; height: 380px; border-radius: 40px; background: #ffffff; box-shadow: 0 16px 36px rgba(27, 28, 30, 0.10); display: flex; align-items: center; justify-content: center; }
      .card svg { width: 220px; height: 220px; display: block; }
      .card svg * { fill: none; stroke: #1f7a33; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      #fTab { position: absolute; left: 700px; top: 760px; width: 190px; height: 44px; border-radius: 14px 14px 0 0; background: #196528; z-index: 2; opacity: 0; }
      #fBack { position: absolute; left: 700px; top: 788px; width: 520px; height: 142px; border-radius: 12px; background: #196528; z-index: 2; opacity: 0; }
      #fFront { position: absolute; left: 700px; top: 800px; width: 520px; height: 130px; border-radius: 12px; background: #1f7a33; z-index: 4; opacity: 0; box-shadow: inset 0 2px 0 rgba(254, 254, 254, 0.18); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s14" data-start="0" data-width="1920" data-height="1080" data-duration="3">
      <p id="t16">ANURA utiliza datos geográficos para mejorar la precisión del modelo.</p>

      <div id="fTab"></div>
      <div id="fBack"></div>

      <div id="stack">
        <div id="c0" class="card" style="left:326px;z-index:1">
          <svg viewBox="0 0 100 100"><path d="M50 92 C50 92 22 62 22 40 A28 28 0 0 1 78 40 C78 62 50 92 50 92 Z"/><circle cx="50" cy="40" r="10"/></svg>
        </div>
        <div id="c1" class="card" style="left:770px;z-index:2">
          <svg viewBox="0 0 100 100"><path d="M8 86 L36 38 L52 62 L62 48 L86 86 Z"/><path d="M88 12 V48 M81 20 L88 12 L95 20 M81 40 L88 48 L95 40"/></svg>
        </div>
        <div id="c2" class="card" style="left:1214px;z-index:3">
          <svg viewBox="0 0 100 100"><rect x="10" y="18" width="80" height="64" rx="8"/><circle cx="32" cy="40" r="7"/><path d="M10 72 L34 52 L50 66 L64 50 L90 74"/></svg>
        </div>
      </div>

      <div id="fFront"></div>

      <audio id="sfx-folder" src="assets/sfx/drop_001.ogg" data-start="1" data-duration="0.11" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const EASE = "expo.out";
      // Las cards vienen de S13 (centros x 516/960/1404, y 530) y viajan a una pila centrada en (960, 400).
      // Escala 300/380; rotaciones -8, 0, +8; 14 px de desplazamiento entre ellas.
      const S = 300 / 380;
      const cx = [516, 960, 1404], targetX = [960 - 14, 960, 960 + 14], rot = [-8, 0, 8];
      // 59.00 -> local 0.00 ... 0.80
      [0, 1, 2].forEach((i) => {
        tl.fromTo("#c" + i, { x: 0, y: 0, scale: 1, rotation: 0 }, { x: targetX[i] - cx[i], y: 400 - 530, scale: S, rotation: rot[i], duration: 0.8, ease: "expo.inOut" }, 0);
      });
      // 59.60 -> local 0.60: T16 sale
      tl.to("#t16", { y: -20, opacity: 0, duration: 0.5, ease: "power2.in" }, 0.6);
      // 60.00 -> local 1.00: aparece el folder
      tl.fromTo(["#fTab", "#fBack", "#fFront"], { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: EASE }, 1);
      // 60.20 -> local 1.25 ... 2.25: la pila baja y el clip la oculta al cruzar el borde del folder
      tl.to(["#c0", "#c1", "#c2"], { y: 460, duration: 1, ease: "expo.inOut" }, 1.25);
      // 61.20 -> local 2.25 ... 3.00: el folder se cierra un poco (la lengüeta baja 8 px)
      tl.to("#fTab", { y: 8, duration: 0.4, ease: "power2.out" }, 2.25);
      window.__timelines["s14"] = tl;
    </script>
  </body>
</html>
