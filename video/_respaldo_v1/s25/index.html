<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S25 La pregunta</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      body { margin: 0; background: #1b1c1e; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1b1c1e; color: #fefefe; font-family: "Archivo", sans-serif; }
      #t24 { position: absolute; margin: 0; left: 160px; top: 460px; width: 1600px; text-align: center; font-weight: 700; font-size: 64px; line-height: 1.15; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s25" data-start="0" data-width="1920" data-height="1080" data-duration="2.5">
      <p id="t24">¿Pero cómo hace todo esto ANURA?</p>
    </div>

    <script>
      // Ventana 100.50–103.00. Entra 100.70–101.10 (t 0.2–0.6). Sale 102.60–103.00 (t 2.1–2.5) y el fondo cruza a #EEF5EE.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t24", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 0.2);
      tl.to("#t24", { opacity: 0, duration: 0.4, ease: "power2.in" }, 2.1);
      tl.to("#root", { backgroundColor: "#eef5ee", duration: 0.4, ease: "power2.inOut" }, 2.1);
      window.__timelines = window.__timelines || {};
      window.__timelines["s25"] = tl;
    </script>
  </body>
</html>
