<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S10 Siempre en el celular</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      body { margin: 0; background: #eef5ee; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eef5ee; color: #1b1c1e; font-family: "Archivo", sans-serif; }
      /* arranca con el aspecto de la pastilla al final de S09 y se vuelve el título */
      #pill { position: absolute; left: 96px; top: 96px; padding: 14px 34px; border-radius: 999px; background: #1f7a33; color: #fefefe; font-weight: 700; font-size: 36px; line-height: 1.1; white-space: nowrap; }
      #pillB { position: absolute; left: 96px; top: 96px; padding: 12px 18px; border-radius: 12px; background: #1f7a33; color: #fefefe; font-weight: 800; font-size: 42px; line-height: 1.1; white-space: nowrap; opacity: 0; }
      #t13 { position: absolute; left: 96px; top: 280px; width: 860px; margin: 0; font-weight: 500; font-size: 64px; line-height: 1.2; opacity: 0; }
      #phone { position: absolute; left: 1188px; top: 130px; width: 384px; height: 820px; box-sizing: border-box; padding: 14px; border-radius: 36px; background: #1b1c1e; box-shadow: 0 24px 40px rgba(27, 28, 30, 0.18); opacity: 0; }
      #phone .scr { width: 100%; height: 100%; border-radius: 24px; overflow: hidden; }
      #phone img { display: block; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s10" data-start="0" data-width="1920" data-height="1080" data-duration="5">
      <div id="pill">IA local</div>
      <div id="pillB">IA local</div>
      <p id="t13">Ya sea monte, desierto o llano, ANURA funciona en tu celular.</p>
      <div id="phone"><div class="scr"><img src="assets/img/1.jpg" alt="" /></div></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const EASE = "expo.out";
      // la pastilla (aspecto S09) se convierte en el título (aspecto S10): 0.00 - 0.30
      tl.to("#pill", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 0);
      tl.to("#pillB", { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 0);
      // 40.20 -> local 0.25: entra el teléfono
      tl.fromTo("#phone", { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: EASE }, 0.25);
      // 40.40 -> local 0.50: T13
      tl.fromTo("#t13", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: EASE }, 0.5);
      // 44.20 -> local 4.25: el teléfono sale por la derecha; título y pastilla salen con él
      tl.to("#phone", { x: 800, duration: 0.75, ease: "power3.in" }, 4.25);
      tl.to(["#pillB", "#t13"], { x: -60, opacity: 0, duration: 0.5, ease: "power2.in" }, 4.5);
      window.__timelines["s10"] = tl;
    </script>
  </body>
</html>
