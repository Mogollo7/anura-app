<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S13 Tres datos</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      body { margin: 0; background: #eef5ee; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eef5ee; color: #1b1c1e; font-family: "Archivo", sans-serif; }
      #t16 { position: absolute; left: 120px; top: 100px; width: 1680px; margin: 0; text-align: center; font-weight: 600; font-size: 64px; line-height: 1.2; opacity: 0; }
      .card { position: absolute; top: 340px; width: 380px; height: 380px; border-radius: 40px; background: #ffffff; box-shadow: 0 16px 36px rgba(27, 28, 30, 0.10); display: flex; align-items: center; justify-content: center; opacity: 0; }
      .card svg { width: 220px; height: 220px; display: block; }
      .card svg * { fill: none; stroke: #1f7a33; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s13" data-start="0" data-width="1920" data-height="1080" data-duration="1.5">
      <p id="t16">ANURA utiliza datos geográficos para mejorar la precisión del modelo.</p>

      <div id="c0" class="card" style="left:326px">
        <svg viewBox="0 0 100 100"><path d="M50 92 C50 92 22 62 22 40 A28 28 0 0 1 78 40 C78 62 50 92 50 92 Z"/><circle cx="50" cy="40" r="10"/></svg>
      </div>
      <div id="c1" class="card" style="left:770px">
        <svg viewBox="0 0 100 100"><path d="M8 86 L36 38 L52 62 L62 48 L86 86 Z"/><path d="M88 12 V48 M81 20 L88 12 L95 20 M81 40 L88 48 L95 40"/></svg>
      </div>
      <div id="c2" class="card" style="left:1214px">
        <svg viewBox="0 0 100 100"><rect x="10" y="18" width="80" height="64" rx="8"/><circle cx="32" cy="40" r="7"/><path d="M10 72 L34 52 L50 66 L64 50 L90 74"/></svg>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const EASE = "expo.out";
      // 57.50: T16 entra en 0.3 s
      tl.fromTo("#t16", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: EASE }, 0);
      // las tres cards entran juntas con outBack suave, y siguen en pantalla al final
      tl.fromTo(".card", { y: 50, scale: 0.9, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.2)" }, 0.25);
      window.__timelines["s13"] = tl;
    </script>
  </body>
</html>
