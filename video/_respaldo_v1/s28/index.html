<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S28 Antes la terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
      body { margin: 0; background: #eef5ee; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eef5ee; color: #1b1c1e; font-family: "Archivo", sans-serif; }
      #txt { position: absolute; left: 80px; top: 280px; width: 760px; display: flex; flex-direction: column; gap: 20px; }
      #txt p, #t30 { margin: 0; }
      #t28 { font-weight: 700; font-size: 48px; line-height: 1.15; opacity: 0; }
      #t29 { font-weight: 500; font-size: 32px; line-height: 1.3; opacity: 0; }
      #t30 { position: absolute; left: 80px; top: 280px; width: 760px; font-weight: 700; font-size: 48px; line-height: 1.15; opacity: 0; }
      #win { position: absolute; left: 960px; top: 260px; width: 800px; height: 480px; border-radius: 16px; background: #1b1c1e; overflow: hidden; box-shadow: 0 24px 48px rgba(27, 28, 30, 0.22); opacity: 0; transform-origin: 50% 50%; }
      #bar { position: absolute; left: 0; top: 0; right: 0; height: 48px; background: #26282b; }
      #bar i { position: absolute; top: 18px; width: 12px; height: 12px; border-radius: 50%; }
      #term { position: absolute; left: 32px; top: 80px; right: 32px; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px; line-height: 1.6; color: #d7e8d4; }
      .ln { margin: 0 0 8px 0; white-space: pre-wrap; }
      .ln b { font-weight: 500; color: #7eb8da; }
      .ch { display: none; }
      .caret { display: inline-block; width: 12px; height: 26px; margin-left: 2px; vertical-align: -5px; background: #d7e8d4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s28" data-start="0" data-width="1920" data-height="1080" data-duration="5">
      <div id="txt">
        <p id="t28">Antes todo era manual.</p>
        <p id="t29">Poco estandarizado, y un solo desarrollador tenía el control.</p>
      </div>
      <p id="t30">Ahora, con el modo admin, puedes repetir el ciclo.</p>
      <div id="win" data-layout-allow-occlusion>
        <div id="bar"><i style="left:20px;background:#e07a5f"></i><i style="left:40px;background:#c6a15b"></i><i style="left:60px;background:#1f7a33"></i></div>
        <div id="term">
          <p class="ln" id="l0"><b>$ </b></p>
          <p class="ln" id="l1"><b>$ </b></p>
        </div>
      </div>
    </div>

    <script>
      // Ventana 112.00–117.00. La terminal escribe a ritmo de beat; se cierra hacia el centro cuando entra T30.
      const tl = gsap.timeline({ paused: true });
      const EASE = "expo.out";
      const LINES = ["poco estandarizado", "un solo desarrollador tenía el control"];
      // cada línea arranca en beat y escribe a corchea/4 (0.0625 s por letra)
      const START = [1.0, 2.0], STEP = [0.055, 0.035];
      const chars = LINES.map((s, k) => {
        const p = document.getElementById("l" + k);
        return [...s].map((c) => { const e = document.createElement("span"); e.className = "ch"; e.textContent = c; p.appendChild(e); return e; });
      });

      tl.fromTo("#t28", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: EASE }, 0.1);
      tl.fromTo("#t29", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: EASE }, 0.8);
      tl.fromTo("#win", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: EASE }, 0.25);

      // un caret por línea; solo se ve el de la línea activa. Parpadeo por beat mientras no escribe. Todo con set, seek-safe.
      const carets = LINES.map((_, k) => { const c = document.createElement("span"); c.className = "caret"; document.getElementById("l" + k).appendChild(c); return c; });
      gsap.set(carets, { opacity: 0 });
      gsap.set("#l1", { opacity: 0 });
      tl.set("#l1", { opacity: 1 }, START[1]);
      chars.forEach((cs, k) => cs.forEach((e, i) => tl.set(e, { display: "inline" }, START[k] + i * STEP[k])));
      const END0 = START[0] + LINES[0].length * STEP[0], END1 = START[1] + LINES[1].length * STEP[1];
      tl.set(carets[0], { opacity: 1 }, 0.5).set(carets[0], { opacity: 0 }, 0.75).set(carets[0], { opacity: 1 }, 1.0);
      tl.set(carets[0], { opacity: 0 }, START[1]).set(carets[1], { opacity: 1 }, START[1]);
      for (let t = Math.ceil(END1 * 4) / 4 + 0.25; t < 3.8; t += 0.5) tl.set(carets[1], { opacity: 0 }, t).set(carets[1], { opacity: 1 }, t + 0.25);

      // 115.80–117.00: la ventana se cierra hacia el centro y entra T30
      tl.to("#win", { scale: 0.6, opacity: 0, duration: 0.6, ease: "power3.in" }, 3.8);
      tl.to("#txt", { y: -24, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.8);
      tl.fromTo("#t30", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: EASE }, 4.25);
      window.__timelines = window.__timelines || {};
      window.__timelines["s28"] = tl;
    </script>
  </body>
</html>
