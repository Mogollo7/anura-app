<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S06 Barras</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
      body { margin: 0; background: #eef5ee; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eef5ee; color: #1b1c1e; font-family: "Archivo", sans-serif; }
      #block { position: absolute; left: 96px; top: 300px; width: 860px; }
      #label, #sub { margin: 0; width: fit-content; font-weight: 500; font-size: 56px; line-height: 1.1; }
      #sub { margin-top: 16px; }
      #num { margin: 24px 0 0 0; width: fit-content; font-weight: 800; font-stretch: 100%; font-size: 260px; line-height: 1; color: #1f7a33; font-variant-numeric: tabular-nums; }
      .ax { position: absolute; background: #1b1c1e; opacity: 0; }
      .head { position: absolute; width: 0; height: 0; opacity: 0; }
      .col { position: absolute; width: 110px; }
      .bar { position: absolute; inset: 0; transform-origin: 50% 100%; }
      .val { position: absolute; left: 0; right: 0; top: -44px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; line-height: 36px; opacity: 0; }
      .cat { position: absolute; top: 846px; width: 110px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; line-height: 36px; opacity: 0; }
      .medal { position: absolute; width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 40px; color: #1b1c1e; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s06" data-start="0" data-width="1920" data-height="1080" data-duration="6">
      <div id="block">
        <p id="label">En el mundo hay cerca de</p>
        <div id="num">9009</div>
        <p id="sub">especies de ellos</p>
      </div>

      <div id="axY" class="ax" style="left:1038px;top:172px;width:4px;height:650px;transform-origin:50% 100%"></div>
      <div id="hdY" class="head" style="left:1026px;top:150px;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:24px solid #1b1c1e"></div>
      <div id="axX" class="ax" style="left:1038px;top:818px;width:782px;height:4px;transform-origin:0% 50%"></div>
      <div id="hdX" class="head" style="left:1820px;top:806px;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:24px solid #1b1c1e"></div>

      <div class="col" style="left:1090px;top:521px;height:299px">
        <div class="val" id="val0">694</div>
        <div class="bar" id="bar0" style="background:#7EB8DA"></div>
      </div>
      <div class="cat" id="cat0" style="left:1090px">PE</div>
      <div class="col" style="left:1228px;top:517px;height:303px">
        <div class="val" id="val1">704</div>
        <div class="bar" id="bar1" style="background:#5B8FA8"></div>
      </div>
      <div class="cat" id="cat1" style="left:1228px">EC</div>
      <div class="col" style="left:1366px;top:512px;height:308px">
        <div class="val" id="val2">716</div>
        <div class="bar" id="bar2" style="background:#E07A5F"></div>
      </div>
      <div class="cat" id="cat2" style="left:1366px">CN</div>
      <div class="col" style="left:1504px;top:428px;height:392px">
        <div class="val" id="val3">911</div>
        <div class="bar" id="bar3" style="background:#1F7A33"></div>
      </div>
      <div class="cat" id="cat3" style="left:1504px">CO</div>
      <div class="col" style="left:1642px;top:300px;height:520px">
        <div class="val" id="val4">1208</div>
        <div class="bar" id="bar4" style="background:#C6A15B"></div>
      </div>
      <div class="cat" id="cat4" style="left:1642px">BR</div>
      <div class="medal" id="medal2" style="left:1385px;top:388px;background:#A97142">3</div>
      <div class="medal" id="medal3" style="left:1523px;top:304px;background:#C5C7C4">2</div>
      <div class="medal" id="medal4" style="left:1661px;top:176px;background:#C6A15B">1</div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const EASE = "expo.out";
      const H = [299, 303, 308, 392, 520];
      const $ = (id) => document.getElementById(id);

      // Texto de S05: de centrado a x=96 (medidas fijas al montar).
      const lines = ["label", "num", "sub"];
      lines.forEach((id) => {
        const r = $(id).getBoundingClientRect();
        const dx = 960 - (r.left + r.width / 2);
        tl.fromTo("#" + id, { x: dx }, { x: 0, duration: 0.4, ease: EASE }, 0);
      });

      // Ejes: Y hacia arriba (0.50), luego X hacia la derecha (0.90)
      tl.set(["#axY", "#hdY"], { opacity: 1 }, 0.5);
      tl.fromTo("#axY", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: EASE }, 0.5);
      tl.fromTo("#hdY", { y: 670 }, { y: 0, duration: 0.4, ease: EASE }, 0.5);
      tl.set(["#axX", "#hdX"], { opacity: 1 }, 0.9);
      tl.fromTo("#axX", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: EASE }, 0.9);
      tl.fromTo("#hdX", { x: -780 }, { x: 0, duration: 0.4, ease: EASE }, 0.9);

      // Barras de izquierda a derecha, menor a mayor: 1.25 ... 2.25
      for (let i = 0; i < 5; i++) {
        const t0 = 1.25 + i * 0.25;
        tl.fromTo("#bar" + i, { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: EASE }, t0);
        tl.fromTo("#val" + i, { y: H[i], opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: EASE }, t0);
        tl.fromTo("#cat" + i, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: EASE }, t0);
      }

      // Medallas solo CN, CO, BR: 2.75, 3.00, 3.25
      [2, 3, 4].forEach((i, k) => {
        tl.fromTo("#medal" + i, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 2.75 + k * 0.25);
      });

      // Salida 4.80 - 6.00
      for (let i = 0; i < 5; i++) {
        const t0 = 4.8 + i * 0.1;
        tl.to("#bar" + i, { scaleY: 0, duration: 0.6, ease: "power3.inOut" }, t0);
        tl.to("#val" + i, { y: H[i], opacity: 0, duration: 0.6, ease: "power3.inOut" }, t0);
        tl.to("#cat" + i, { opacity: 0, duration: 0.4, ease: "power2.in" }, t0);
      }
      tl.to(["#medal2", "#medal3", "#medal4"], { scale: 0, opacity: 0, duration: 0.35, ease: "power2.in" }, 4.8);
      tl.to(["#axY", "#hdY", "#axX", "#hdX"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.3);
      tl.to("#block", { y: -24, opacity: 0, duration: 0.6, ease: "power2.in" }, 5.3);

      window.__timelines["s06"] = tl;
    </script>
  </body>
</html>
