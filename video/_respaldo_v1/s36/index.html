<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ANURA S36 Cierre</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); font-style: italic; font-weight: 400; }
      body { margin: 0; background: #1f7a33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1f7a33; color: #fefefe; font-family: "Archivo", sans-serif; }
      #mark { position: absolute; margin: 0; left: 0; top: 420px; width: 1920px; text-align: center; font-weight: 900; font-stretch: 100%; font-size: 120px; line-height: 1; opacity: 0; }
      #sub { position: absolute; margin: 0; left: 0; top: 568px; width: 1920px; text-align: center; font-family: "Instrument Serif", serif; font-style: italic; font-size: 40px; line-height: 1.2; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s36" data-start="0" data-width="1920" data-height="1080" data-duration="4">
      <p id="mark">ANURA</p>
      <p id="sub">Identificación de anuros.</p>
    </div>
    <script>
      // Ventana 144.00–148.00. Entrada 144.20–144.70 con outBack; después, hold quieto hasta el final.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mark", { y: 24, scale: 0.92, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.2);
      tl.fromTo("#sub", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.25);
      tl.set({}, {}, 4);
      window.__timelines = window.__timelines || {};
      window.__timelines["s36"] = tl;
    </script>
  </body>
</html>
